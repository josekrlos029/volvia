name: volvia

services:
  postgres:
    image: postgres:16-alpine
    container_name: volvia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: volvia
      POSTGRES_PASSWORD: volvia
      POSTGRES_DB: volvia
      # Neon runs UTC; keep local identical so date rollups match production.
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - max_connections=200
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volvia -d volvia"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: volvia-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "56379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Catch-all SMTP: every email the platform sends lands in http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: volvia-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "51025:1025"
      - "58025:8025"

  # S3-compatible object storage; swapped for GCS in production via the storage adapter.
  minio:
    image: minio/minio:latest
    container_name: volvia-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: volvia
      MINIO_ROOT_PASSWORD: volvia-dev-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    container_name: volvia-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 volvia volvia-dev-secret &&
      mc mb --ignore-existing local/volvia-uploads &&
      mc anonymous set download local/volvia-uploads &&
      echo 'minio ready: bucket volvia-uploads'
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
