name: volvia

services:
  postgres:
    image: postgres:16-alpine
    container_name: volvia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: volvia
      POSTGRES_PASSWORD: volvia
      POSTGRES_DB: volvia
      # Neon runs UTC; keep local identical so date rollups match production.
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - max_connections=200
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volvia -d volvia"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: volvia-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "56379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Catch-all SMTP: every email the platform sends lands in http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: volvia-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "51025:1025"
      - "58025:8025"

  # S3-compatible object storage; swapped for GCS in production via the storage adapter.
  #
  # Not MinIO: it stopped publishing a public image during 2025, so `docker pull
  # minio/minio` now fails on any machine that has not already cached one. S3Mock speaks
  # the same API for everything the adapter does — presigned PUT with path style and
  # anonymous GET — and needs no credentials or policy file to say so.
  storage:
    image: adobe/s3mock:3.12.0
    container_name: volvia-storage
    restart: unless-stopped
    environment:
      # Keep the uploads on the volume so a logo survives a restart.
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: us-east-1
    ports:
      - "59000:9090"
    volumes:
      - storagedata:/data

  # No healthcheck on the storage container: the image carries no shell tools to probe
  # itself with. The init container does the waiting instead, which is the thing that
  # actually has to succeed before anything else cares.
  storage-init:
    image: curlimages/curl:8.11.1
    container_name: volvia-storage-init
    depends_on:
      - storage
    entrypoint: >
      /bin/sh -c "
      curl -sf --retry 30 --retry-delay 1 --retry-connrefused
      -X PUT http://storage:9090/volvia-uploads &&
      echo 'storage ready: bucket volvia-uploads'
      "

volumes:
  pgdata:
  redisdata:
  storagedata:
